# PrusaSlicer config bundle for the Flashforge Creator 4 (right extruder / T0 only).
#
# STATUS: start/end gcode and the coordinate system below are reverse-engineered
# from a REAL FlashPrint 5 export (a 20mm calibration cube, right extruder, ABS --
# see ../samples/real_creator4_20mm_box.gcode and ../README.md "Confirmed from a
# real sample"). Print/filament tuning values (speeds, layer height, PLA temps)
# are still best-effort defaults, not confirmed. Still do a supervised first print.
#
# Import via PrusaSlicer > File > Import Config Bundle.

[printer:Flashforge Creator 4 (Right Extruder)]
printer_technology = FFF
printer_model = Creator4
printer_variant = 0.4
gcode_flavor = marlin
single_extruder_multi_material = 0
use_relative_e_distances = 0
use_firmware_retraction = 0
silent_mode = 0
remaining_times = 0
nozzle_diameter = 0.4
retract_length = 1.5
retract_speed = 20
deretract_speed = 0
retract_before_travel = 1
retract_before_wipe = 100%
retract_layer_change = 1
wipe = 1
z_offset = 0
# Build volume per Flashforge's published Creator 4 spec (400 x 350 x 500 mm).
# The real sample's gcode uses XY coordinates centered near (0,0) for a small
# (20mm) part -- confirming a centered coordinate system, NOT the corner-origin
# layout used by older Flashforge machines. The exact extents/whether the
# origin is exactly bed-center (vs. offset for the right IDEX head specifically)
# is inferred from the published build volume, not confirmed by the sample
# (the sample part was too small and too close to center to tell).
bed_shape = -200x-175,200x-175,200x175,-200x175
max_print_height = 500
# Start/end gcode below is the REAL sequence from a working Creator 4 FlashPrint 5
# export (right extruder, ABS, 20mm cube) -- see ../samples/real_creator4_20mm_box.gcode.
# Notably: no G28/G161 homing and no M132 offset-load appear anywhere in that file
# (unlike the older Creator Pro 2's PrusaSlicer profile this was originally
# drafted from) -- the Creator 4 apparently doesn't home via the print gcode
# itself. M654/M653/M656/M652 are Flashforge codes of unknown meaning; their
# values are copied verbatim from the real export rather than guessed.
# M118's X/Y/Z are hardcoded to the full bed footprint/height (200/175/500)
# rather than templated with {first_layer_print_max[...]}/{max_layer_z}: the
# OrcaSlicer equivalent of this line was tested for real and OrcaSlicer's
# parser rejected those exact variable names ("Not a variable name"). Not
# confirmed broken in PrusaSlicer specifically, but M118 is purely
# informational (bounding box display, doesn't affect print geometry), so
# there's no upside to the per-print-accurate version versus the risk.
start_gcode = M118 X200 Y175 Z500 T0\nM140 S{first_layer_bed_temperature[0]} T0\nM104 S{first_layer_temperature[0]} T0\nM104 S0 T1\nM654 P60\nM653 S55\nM656 S300\nM107 T0\nM107 T1\nM204 S1000\nM900 K0.000 T0\nG90\nG1 Z50.000 F420\nM7 T0\nM6 T0\nM652\nM108 T0\n
end_gcode = M107 T0\nM107 T1\nM104 S0 T0\nM140 S0 T0\nG162 Z F1800\nM652\nG91\nM18\n
toolchange_gcode =
between_objects_gcode =
before_layer_gcode = ;BEFORE_LAYER_CHANGE\n;[layer_z]\n
layer_gcode =
printer_notes = Flashforge Creator 4, right extruder (T0) only. Requires flashforge_gx_post.py as a post-processing script and Output filename format ending in .gx. See ../README.md.
# Point this at your local checkout of flashforge_gx_post.py, e.g.:
# post_process = python "C:\path\to\FlashforgeCreator4Bridge\scripts\flashforge_gx_post.py"
post_process =

[print:0.20mm NORMAL @Flashforge Creator 4]
# UNVERIFIED: reasonable generic defaults, not confirmed against a real print.
# Pair with "0.18mm CONFIRMED" below if you want settings known to match a
# real working FlashPrint 5 export.
inherits =
layer_height = 0.2
first_layer_height = 0.2
perimeters = 2
top_solid_layers = 4
bottom_solid_layers = 4
fill_density = 15%
fill_pattern = grid
perimeter_speed = 45
infill_speed = 60
travel_speed = 150
first_layer_speed = 20
support_material = 0
compatible_printers_condition = printer_notes=~/.*Creator 4.*/

[print:0.18mm CONFIRMED (FlashPrint defaults) @Flashforge Creator 4]
# CONFIRMED: layer height, shell counts, infill, and speeds match a real,
# working Creator 4 FlashPrint 5 export exactly -- see
# ../samples/real_creator4_20mm_box.gcode. Pair with the "Generic ABS" filament
# profile above (this combination is the one actually observed working).
inherits =
layer_height = 0.18
first_layer_height = 0.18
perimeters = 3
top_solid_layers = 4
bottom_solid_layers = 3
fill_density = 20%
fill_pattern = hexagon
perimeter_speed = 50
infill_speed = 50
travel_speed = 80
first_layer_speed = 50
support_material = 0
compatible_printers_condition = printer_notes=~/.*Creator 4.*/

[filament:Generic PLA @Flashforge Creator 4]
# UNVERIFIED: reasonable default PLA temps, not confirmed against a real print
# (the real sample we have is ABS -- see the ABS profile below for confirmed values).
inherits =
filament_type = PLA
first_layer_temperature = 210
temperature = 205
first_layer_bed_temperature = 60
bed_temperature = 60
fan_always_on = 1
cooling = 1
min_fan_speed = 100
max_fan_speed = 100
compatible_printers_condition = printer_notes=~/.*Creator 4.*/

[filament:Generic ABS @Flashforge Creator 4]
# CONFIRMED: temperatures/bed temp match a real, working Creator 4 FlashPrint 5
# export exactly (right_extruder_temperature_raft0=235, right_extruder_temperature=230,
# platform_temperature=110 -- see ../samples/real_creator4_20mm_box.gcode).
inherits =
filament_type = ABS
first_layer_temperature = 235
temperature = 230
first_layer_bed_temperature = 110
bed_temperature = 110
fan_always_on = 0
cooling = 0
min_fan_speed = 0
max_fan_speed = 0
compatible_printers_condition = printer_notes=~/.*Creator 4.*/
